version: 2
sources:
  - name: bronze
    description: >
      Phase 1 output (pipeline/ingest.py). A faithful, typed copy of the raw MIND files.
      Location: $OWNFEED_LAKE (set by Airflow), default ../lake/bronze relative to warehouse/.
    tables:
      - name: news
        config:
          meta:
            external_location: "read_parquet('{{ env_var('OWNFEED_LAKE', '../lake/bronze') }}/news/*/*.parquet', hive_partitioning = true)"
      - name: behaviors
        config:
          meta:
            external_location: "read_parquet('{{ env_var('OWNFEED_LAKE', '../lake/bronze') }}/behaviors/*/*.parquet', hive_partitioning = true)"
